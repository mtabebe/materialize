// BE CAREFUL! Unlike other Materialize Protos, Persist's messages need to
// be forward-compatible and roundtrip losslessly between versions. Consider
// making your Proto changes in a release before you populate non-default values,
// or guard the code changes behind a feature flag.

syntax = "proto3";

package mz_persist_client.batch;

import "persist-client/src/internal/state.proto";

message ProtoBatch {
  string shard_id = 1;
  string version = 2;
  bytes key_schema = 5;
  bytes val_schema = 6;

  mz_persist_client.internal.state.ProtoHollowBatch batch = 3;

  // Set iff the batch's parts live under `leased/<lease>/<object>/`. Code that predates this field
  // completes keys under `shard_id` and misses, so a leased batch must only reach readers that
  // know it. Unset decodes as a shard batch.
  optional ProtoLeasedRoot leased = 7;

  reserved 4;
}

message ProtoLeasedRoot {
  string lease = 1;
  string object = 2;
}
